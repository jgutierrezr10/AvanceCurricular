# Puerto
server.port=${PORT:8080}

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET:mi-clave-super-secreta-avance-curricular-2024}
jwt.expiration=86400000

# Google OAuth
google.client.id=${GOOGLE_CLIENT_ID:1094945602005-g7suv5k55ah2t0sqkppnl9jjkgc2svur.apps.googleusercontent.com}


# Correo (API Brevo / Sendinblue)
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${MAIL_USERNAME:}

# AI (Gemini - gratis hasta 60 req/min)
ai.api.key=${GEMINI_API_KEY:}
ai.provider=gemini

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.db.enabled=false
management.health.mail.enabled=false