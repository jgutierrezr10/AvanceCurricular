<div class="auth-page">
  <div class="auth-wrapper">
    <!-- Panel Izquierdo -->
    <div class="auth-left">
      <div class="auth-brand">
        <img src="assets/images/logo.png" alt="AULA Logo" class="brand-logo-img" />
        <h1>AULA</h1>
      </div>
      
      <div class="auth-left-content" style="display: flex; align-items: center; gap: 1.5rem; justify-content: space-between;">
        <div class="auth-left-text-group" style="flex: 1;">
          <div class="auth-greeting">
            <h2>¡Hola!</h2>
            <h3>Bienvenido a AULA.</h3>
            <p>Organiza tu semestre,<br>gestiona tus ramos y<br>alcanza tus metas.</p>
          </div>
          
          <div class="auth-features" style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1.5rem;">
            <div class="feature-pill">
              <div class="feature-icon bg-purple"><i class="bi bi-mortarboard-fill"></i></div>
              <span>Todo tu mundo académico</span>
            </div>
            <div class="feature-pill">
              <div class="feature-icon bg-blue"><i class="bi bi-calendar2-check-fill"></i></div>
              <span>Organizado y al día</span>
            </div>
            <div class="feature-pill">
              <div class="feature-icon bg-indigo"><i class="bi bi-graph-up-arrow"></i></div>
              <span>Enfocado en tu éxito</span>
            </div>
          </div>
        </div>

        <div class="mascot-container-inline" style="flex: 1.3; text-align: center;">
          <img src="assets/images/mascot.png" alt="Mascota" style="max-width: 460px; width: 100%; height: auto; transform: scale(1.2); transform-origin: center;" />
        </div>
      </div>
    </div>

    <!-- Panel Derecho -->
    <div class="auth-right">
      <div class="auth-form-card">
        <div class="card-header">
          <img src="assets/images/logo.png" alt="AULA Logo" class="form-logo" />
          <h2>AULA</h2>
          <p>Tu aprendizaje, sin límites.</p>
        </div>

        <div class="form-group">
          <label for="reg-nombre">Nombre completo</label>
          <div class="input-wrapper">
            <i class="bi bi-person input-icon"></i>
            <input id="reg-nombre" type="text" [(ngModel)]="nombre" placeholder="Juan Pérez"
              autocomplete="name" autofocus />
          </div>
        </div>

        <div class="form-group">
          <label for="reg-email">Correo electrónico</label>
          <div class="input-wrapper">
            <i class="bi bi-envelope input-icon"></i>
            <input id="reg-email" type="email" [(ngModel)]="email" placeholder="ejemplo@uc.cl"
              autocomplete="email" />
          </div>
        </div>

        <div class="form-group">
          <label for="reg-password">Contraseña</label>
          <div class="input-wrapper">
            <i class="bi bi-lock input-icon"></i>
            <input id="reg-password" [type]="mostrarPassword ? 'text' : 'password'" [(ngModel)]="password" placeholder="Mínimo 6 caracteres"
              autocomplete="new-password" (keyup.enter)="register()" />
            <i class="toggle-password bi" [ngClass]="mostrarPassword ? 'bi-eye-slash' : 'bi-eye'" 
               (click)="mostrarPassword = !mostrarPassword"></i>
          </div>
        </div>

        <div class="form-actions">
          <div class="checkbox-wrapper">
            <input type="checkbox" id="terminos" [(ngModel)]="terminosAceptados" name="terminos" required />
            <label for="terminos">
              Acepto los <a href="javascript:void(0)" (click)="mostrarTerminos()" class="forgot-password-link">Términos y Condiciones</a>
            </label>
          </div>
        </div>

        <div class="error-msg" *ngIf="error">
          <i class="bi bi-exclamation-triangle-fill"></i>
          {{ error }}
        </div>

        <button class="btn-submit" (click)="register()" [disabled]="cargando || !terminosAceptados">
          <span *ngIf="!cargando">Crear cuenta</span>
          <span *ngIf="cargando">Registrando...</span>
          <i class="bi bi-arrow-right" *ngIf="!cargando"></i>
          <i class="bi bi-arrow-repeat spin" *ngIf="cargando"></i>
        </button>

        <p class="auth-link" style="margin-top: 1rem;">
          ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
        </p>
      </div>
    </div>
  </div>
  
  <div class="auth-footer">
    <i class="bi bi-shield-check"></i> Seguro, privado y hecho para estudiantes.
  </div>
</div>
