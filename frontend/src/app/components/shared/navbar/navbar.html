<div class="navbar-wrapper">
  <nav class="navbar-content">
    <a routerLink="/dashboard" class="nav-brand">
      <img src="assets/images/logo.png" alt="Logo" class="nav-brand-img" style="height: 32px; width: auto; object-fit: contain; margin-right: 8px;" />
      <span>AULA</span>
    </a>
    
    <div class="nav-links">
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
        <i class="bi bi-house-door"></i> Dashboard
      </a>
      <a routerLink="/malla" routerLinkActive="active" class="nav-link">
        <i class="bi bi-grid-3x3"></i> Malla
      </a>
      <a routerLink="/horario" routerLinkActive="active" class="nav-link">
        <i class="bi bi-calendar3"></i> Horario
      </a>
      <a routerLink="/notas" routerLinkActive="active" class="nav-link">
        <i class="bi bi-check2-square"></i> Notas
      </a>
      <a routerLink="/calendario" routerLinkActive="active" class="nav-link">
        <i class="bi bi-calendar-event"></i> Calendario
      </a>
    </div>

    <div class="nav-actions">

      <div class="nav-profile-container">
        <div class="nav-profile" (click)="toggleDropdown($event)">
          <div class="avatar-circle">
            {{ nombreUsuario ? nombreUsuario.charAt(0).toUpperCase() : 'U' }}
          </div>
          <div class="profile-text">
            <span class="user-name">{{ nombreUsuario }}</span>
            <span class="user-role">Estudiante</span>
          </div>
          <i class="bi bi-chevron-down profile-chevron"></i>
        </div>

        <!-- Dropdown Menu -->
        <div class="profile-dropdown" *ngIf="mostrarDropdown">
          <button class="dropdown-item" (click)="abrirMiCuenta()">
            <i class="bi bi-person-gear"></i> Mi Cuenta
          </button>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item text-danger" (click)="logout()">
            <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
          </button>
        </div>
      </div>
    </div>
  </nav>
</div>

<!-- Modal "Mi Cuenta" -->
<div class="overlay" *ngIf="mostrarModalCuenta" (click)="cerrarMiCuenta()">
  <div class="modal modal-pequeno" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3><i class="bi bi-gear-fill"></i> Configurar Mi Cuenta</h3>
      <button class="modal-close" (click)="cerrarMiCuenta()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <form (ngSubmit)="actualizarCuenta()">
      <div class="modal-body">

        <!-- Mensajes de Estado -->
        <div class="alert alert-danger" *ngIf="errorMsg">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <span>{{ errorMsg }}</span>
        </div>
        <div class="alert alert-success" *ngIf="successMsg">
          <i class="bi bi-check-circle-fill"></i>
          <span>{{ successMsg }}</span>
        </div>

        <!-- Nombre -->
        <div class="form-group">
          <label for="nombre">Nombre Completo</label>
          <div class="input-container">
            <i class="bi bi-person"></i>
            <input type="text" id="nombre" name="nombre" [(ngModel)]="nombre" required placeholder="Ej: Juan Pérez" />
          </div>
        </div>


        <div class="form-divider">
          <span>Cambiar Contraseña (Opcional)</span>
        </div>

        <!-- Contraseña Actual -->
        <div class="form-group">
          <label for="currentPassword">Contraseña Actual</label>
          <div class="input-container">
            <i class="bi bi-shield-lock"></i>
            <input type="password" id="currentPassword" name="currentPassword" [(ngModel)]="currentPassword"
              placeholder="Ingresa tu clave actual" />
          </div>
          <p class="help-text" *ngIf="newPassword">Obligatoria si deseas definir una nueva contraseña</p>
        </div>

        <!-- Nueva Contraseña -->
        <div class="form-group">
          <label for="newPassword">Nueva Contraseña</label>
          <div class="input-container">
            <i class="bi bi-key-fill"></i>
            <input type="password" id="newPassword" name="newPassword" [(ngModel)]="newPassword"
              placeholder="Mínimo 6 caracteres" />
          </div>
        </div>
      </div>

      <div class="modal-acciones">
        <button type="button" class="btn-logout-modal" (click)="logout()">
          <i class="bi bi-box-arrow-right"></i> Salir
        </button>
        <div class="modal-acciones-right">
          <button type="button" class="btn-cancelar" (click)="cerrarMiCuenta()" [disabled]="guardando">
            Cancelar
          </button>
          <button type="submit" class="btn-guardar" [disabled]="guardando">
            <i class="bi bi-save-fill" *ngIf="!guardando"></i>
            <span>{{ guardando ? 'Guardando...' : 'Guardar Cambios' }}</span>
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
